[project]
name = "rl-lab"
version = "0.1.0"
description = "A lightweight and educational, PyTorch-native post-training recipes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
